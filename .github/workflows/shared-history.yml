name: Shared history contract

on:
  push:
    branches:
      - main
      - design/unified-history-chatgpt-mcp
  pull_request:

permissions:
  contents: read

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate shared history SQL and invariants
        run: python -m unittest discover -s tests -p "test_shared_history_contract.py" -v
