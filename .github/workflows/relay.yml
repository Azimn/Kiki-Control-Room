name: Kiki relay tests

on:
  push:
    branches:
      - main
      - prototype/free-calendar-telegram-relay
  pull_request:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run mocked relay tests
        run: node --test tests/relay.test.cjs
