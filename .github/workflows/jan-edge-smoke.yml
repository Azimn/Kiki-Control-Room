name: Jan-v1-edge isolated smoke test
"on":
  push:
    branches:
      - experiment/kiki-jan-edge-smoke-20261115
permissions:
  contents: read
jobs:
  jan-edge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare llama.cpp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential libcurl4-openssl-dev
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp/build --target llama-server -j 3
      - name: Fetch official Jan quantization
        run: |
          curl --fail --location --retry 3 --retry-delay 3 --output /tmp/Jan-v1-edge-Q4_K_M.gguf 'https://huggingface.co/janhq/Jan-v1-edge-gguf/resolve/main/Jan-v1-edge-Q4_K_M.gguf'
          test "$(stat --printf='%s' /tmp/Jan-v1-edge-Q4_K_M.gguf)" -gt 1000000000
          sha256sum /tmp/Jan-v1-edge-Q4_K_M.gguf
      - name: Execute public-safe model probes
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/Jan-v1-edge-Q4_K_M.gguf -c 4096 -t 4 --host 127.0.0.1 --port 8080 --no-webui >/tmp/llama.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          ready=0
          for attempt in $(seq 1 100); do
            if curl -fsS 'http://127.0.0.1:8080/health' >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/llama.log; exit 1; fi
          python3 tests/jan_edge_smoke.py
      - name: Save raw inference results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jan-v1-edge-smoke-results
          path: jan_edge_results.json
          if-no-files-found: warn
